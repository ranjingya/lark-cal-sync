name: lark-cal-sync

services:
  lark-cal-sync:
    image: "${IMAGE:-ghcr.io/ranjingya/lark-cal-sync:latest}"
    container_name: lark-cal-sync
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    volumes:
      - calendar-data:/app/data
    labels:
      traefik.enable: "true"
      traefik.docker.network: "${TRAEFIK_NETWORK:-traefik-network}"
      traefik.http.routers.lark-cal-sync.rule: "Host(`${CALENDAR_DOMAIN:-lark-cal.skills.kktree.cn}`)"
      traefik.http.routers.lark-cal-sync.entrypoints: "${TRAEFIK_ENTRYPOINT:-websecure}"
      traefik.http.routers.lark-cal-sync.tls: "true"
      traefik.http.routers.lark-cal-sync.tls.certresolver: "${TRAEFIK_CERTRESOLVER:-myresolver}"
      traefik.http.routers.lark-cal-sync.service: lark-cal-sync
      traefik.http.services.lark-cal-sync.loadbalancer.server.port: "8000"
    networks:
      - traefik-network
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  calendar-data:
    name: lark-cal-sync_calendar-data

networks:
  traefik-network:
    external: true
    name: "${TRAEFIK_NETWORK:-traefik-network}"
