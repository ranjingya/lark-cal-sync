[project]
name = "lark-cal-sync"
version = "0.1.0"
description = "将飞书日历发布为 ICS 订阅的 Python 服务"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "icalendar>=7.3.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
lark-cal-sync = "lark_cal_sync.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lark_cal_sync"]
